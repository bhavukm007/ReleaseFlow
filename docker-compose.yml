services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: releaseflow
      POSTGRES_USER: releaseflow
      POSTGRES_PASSWORD: releaseflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://releaseflow:releaseflow@db:5432/releaseflow
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      JWT_SECRET: local-development-secret-change-before-deployment
      COOKIE_SECURE: "false"
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "7"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  postgres_data:
