services:
  - type: web
    name: releaseflow-api-bhavukm007
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: releaseflow-db-bhavukm007
          property: connectionString
      - key: CORS_ORIGINS
        value: https://releaseflow-web-bhavukm007.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: releaseflow-web-bhavukm007
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://releaseflow-api-bhavukm007.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: releaseflow-db-bhavukm007
    plan: free
    databaseName: releaseflow
    user: releaseflow
